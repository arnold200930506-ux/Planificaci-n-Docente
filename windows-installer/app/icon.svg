<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#eab308" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Shield Crest -->
  <path d="M 256 70 L 390 120 C 390 260 330 370 256 420 C 182 370 122 260 122 120 Z" fill="url(#shieldGrad)" stroke="#fde047" stroke-width="8" />

  <!-- Inner Open Book Symbol -->
  <path d="M 256 220 C 230 195 180 195 160 200 L 160 330 C 180 325 230 325 256 350 C 282 325 332 325 352 330 L 352 200 C 332 195 282 195 256 220 Z" fill="#ffffff" />
  
  <!-- Book Spine Divider -->
  <line x1="256" y1="220" x2="256" y2="350" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />

  <!-- Golden Torch of Knowledge -->
  <path d="M 244 140 L 268 140 L 260 195 L 252 195 Z" fill="url(#goldGrad)" />
  <path d="M 256 105 Q 268 120 256 138 Q 244 120 256 105 Z" fill="#ef4444" />
  <path d="M 256 115 Q 262 125 256 135 Q 250 125 256 115 Z" fill="#fde047" />

  <!-- Educational Stars -->
  <circle cx="210" cy="155" r="7" fill="#fde047" />
  <circle cx="302" cy="155" r="7" fill="#fde047" />

  <!-- Text Bottom Label MINERD -->
  <text x="256" y="465" text-anchor="middle" fill="#fde047" font-family="system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="4">MINERD RD</text>
</svg>
