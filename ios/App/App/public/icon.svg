<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="40%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-opacity="0.65" />

  <!-- Outer Security Seal Badge Glow -->
  <circle cx="256" cy="242" r="186" fill="#1e3a8a" opacity="0.3" filter="url(#glow)" />

  <!-- Institutional Crest Shield -->
  <path d="M 256 64 L 406 122 C 406 280 338 388 256 428 C 174 388 106 280 106 122 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="7" />

  <!-- Dominican Republic Flag Inspired Diagonal Accents -->
  <path d="M 256 70 L 400 125 C 385 240 335 340 256 420 Z" fill="#ffffff" opacity="0.06" />

  <!-- Golden Open Book of Pedagogy -->
  <path d="M 256 226 C 228 198 172 198 148 205 L 148 335 C 172 328 228 328 256 354 C 284 328 340 328 364 335 L 364 205 C 340 198 284 198 256 226 Z" 
        fill="#ffffff" 
        stroke="#cbd5e1" 
        stroke-width="3" />

  <!-- Book Spine Divider with Golden Highlight -->
  <line x1="256" y1="226" x2="256" y2="354" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="230" x2="256" y2="350" stroke="#eab308" stroke-width="2" stroke-linecap="round" />

  <!-- Central Author Monogram Seal "AJS" (Licdo. Arnold Javier Sanchez) -->
  <circle cx="256" cy="154" r="42" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="4.5" />
  <text x="256" y="166" text-anchor="middle" fill="url(#goldGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" letter-spacing="1.5">AJS</text>

  <!-- Crown / Star of Excellence above Monogram -->
  <polygon points="256,92 263,108 280,108 266,118 271,134 256,124 241,134 246,118 232,108 249,108" fill="url(#goldGrad)" />
  <polygon points="214,106 219,118 232,118 222,126 225,138 214,130 203,138 206,126 196,118 209,118" fill="url(#goldGrad)" opacity="0.8" />
  <polygon points="298,106 303,118 316,118 306,126 309,138 298,130 287,138 290,126 280,118 293,118" fill="url(#goldGrad)" opacity="0.8" />

  <!-- Institutional Banner Bottom Ribbon -->
  <path d="M 80 435 L 256 415 L 432 435 L 416 482 L 256 468 L 96 482 Z" fill="#091124" stroke="url(#goldGrad)" stroke-width="3" />
  
  <text x="256" y="445" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="15" letter-spacing="2">DR. PEÑA GÓMEZ • CÓD. 14668</text>
  <text x="256" y="464" text-anchor="middle" fill="url(#goldGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="12" letter-spacing="1.5">AUTORÍA: LIC. ARNOLD JAVIER SANCHEZ</text>
</svg>
